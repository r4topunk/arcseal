[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 10_000
# test/ffi runs `node ../packages/sdk/scripts/ffi-hash-vote.mjs` to compare hashVote with the built SDK (PRD 8.1).
# Only that test calls vm.ffi. The root scripts (contracts:test, contracts:test:ci, test, check) build the SDK first.
ffi = true
fs_permissions = [{ access = "read", path = "../deployments" }, { access = "read", path = "./test/vectors" }]
# `event Sealed` inside `abstract contract Sealed` is intentional (the SDK reads `Sealed` logs); silence only the
# resulting shadowing warning (2519), only for that file. The default ignored_error_codes stay untouched.
ignored_error_codes_from = [["src/Sealed.sol", [2519]]]

[profile.default.fuzz]
runs = 1000
# fixed seed keeps .gas-snapshot reproducible; override with --fuzz-seed for exploration
seed = "0x4172635365616c"

[profile.default.invariant]
runs = 256
depth = 64

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"
arc_testnet = "https://rpc.testnet.arc.io"

[lint]
# Round and window math is timestamp-based by design (windows are minutes to days; validator drift is seconds).
# See docs/SPEC.md.
exclude_lints = ["block-timestamp"]

[fmt]
line_length = 120
